    <!-- dish -->
    <circle cx="0" cy="-15" r="6" fill="none" stroke="#A8D4E6" stroke-width="2"/>
    <line x1="0" y1="-9" x2="0" y2="-15" stroke="#A8D4E6" stroke-width="1.6"/>
